services:
  yetipredict-nodejs:
    container_name: yetipredict-nodejs
    build:
      context: ./
      dockerfile: ./docker/web/Dockerfile
      network: host
    restart: unless-stopped
    ports:
      - "127.0.0.1:3829:80"
    depends_on:
      - yetipredict-mongo
  yetipredict-mongo:
    container_name: yetipredict-mongo
    image: mongo:4
    command: mongod --port 27017 --bind_ip 0.0.0.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
volumes:
  mongo_data:
    name: yetipredict_mongo_data
